name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp app/index.html app/style.css app/app.js www/
          npx esbuild native/native.js --bundle --minify --format=iife --outfile=www/native.js
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Edit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-Edit-apk
          path: Daily-Edit.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Daily-Edit.apk --title "Daily Edit (latest APK)" --notes "Download Daily-Edit.apk and install it on your Android phone." --target "${{ github.sha }}"

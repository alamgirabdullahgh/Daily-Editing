name: Dub 2 - Bengali voice and subtitles

# ধাপ ২: অনুবাদ (work/<id>/bn.json) থেকে বাংলা কণ্ঠ বানায়, মূল ভিডিওতে বসায়, সাবটাইটেল জোড়ে।
on:
  workflow_dispatch:
    inputs:
      id:
        description: "ভিডিও আইডি (work ফোল্ডারের নাম)"
        required: true
      voice:
        description: "কণ্ঠ"
        default: "bn-BD-PradeepNeural"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dub-work
          path: dw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install edge-tts numpy pillow
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
          VID: ${{ inputs.id }}
          VOICE: ${{ inputs.voice }}
        run: python scripts/render.py
